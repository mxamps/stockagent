name: Daily Stock Report

on:
  schedule:
    # 19:00 UTC = 7:00 AM NZST (UTC+12). Sun-Thu UTC = Mon-Fri NZ.
    # During NZ daylight saving (UTC+13, ~late Sep-early Apr) change to "0 18".
    - cron: "0 19 * * 0-4"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run agent
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python main.py

      - name: Commit results
        run: |
          git config user.name "stock-agent-bot"
          git config user.email "actions@github.com"
          git add -A data/ docs/
          git diff --cached --quiet || git commit -m "Daily report $(date -u +%Y-%m-%d)"
          git push
